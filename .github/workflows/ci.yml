name: Fabric Sales Accelerator CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      provision_fabric:
        description: Run Fabric provisioning after validation
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  validate:
    name: Validate accelerator
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JSON
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $config = Get-Content .\config\accelerator-config.json -Raw | ConvertFrom-Json
          
          # Validate all pipeline templates referenced in config
          $templates = @()
          if ($null -ne $config.pipelines -and $config.pipelines.GetType().IsArray) {
            foreach ($p in $config.pipelines) {
              $tName = if ([string]::IsNullOrEmpty($p.templateName)) { "salesdatapipeline.json" } else { $p.templateName }
              $templates += ".\config\$tName"
            }
          } else {
            $templates += ".\config\salesdatapipeline.json"
          }
          
          foreach ($t in $templates | Select-Object -Unique) {
            Get-Content $t -Raw | ConvertFrom-Json | Out-Null
          }

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $files = @(
            '.\infra\create-capacity.ps1',
            '.\scripts\deploy.ps1',
            '.\scripts\provision-fabric.ps1',
            '.\scripts\azd-deploy.ps1'
          )

          foreach ($file in $files) {
            $errors = $null
            $null = [System.Management.Automation.PSParser]::Tokenize((Get-Content $file -Raw), [ref]$errors)

            if ($errors) {
              $errors | Format-List
              exit 1
            }
          }

      - name: Validate accelerator assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $config = Get-Content .\config\accelerator-config.json -Raw | ConvertFrom-Json
          
          $requiredFiles = @(
            '.\powerbi\SalesDashboard.pbix',
            '.\README.md'
          )
          
          # Add datasets from pipelines config
          if ($null -ne $config.pipelines -and $config.pipelines.GetType().IsArray) {
            foreach ($p in $config.pipelines) {
              $requiredFiles += ".\data\$($p.sourceFile)"
            }
          } else {
            $requiredFiles += ".\data\$($config.sourceFile)"
          }
          
          # Add notebooks from notebooks config
          if ($null -ne $config.notebooks -and $config.notebooks.GetType().IsArray) {
            foreach ($nb in $config.notebooks) {
              $requiredFiles += ".\notebooks\$($nb.notebookName).py"
            }
          } else {
            if (-not [string]::IsNullOrWhiteSpace($config.notebookName)) {
              $requiredFiles += ".\notebooks\$($config.notebookName).py"
            }
          }
          
          foreach ($file in $requiredFiles | Select-Object -Unique) {
            if (!(Test-Path $file)) {
              throw "Missing required file: $file"
            }
          }

  provision:
    name: Provision Fabric
    runs-on: windows-latest
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.provision_fabric == 'true'
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Fabric CLI extension
        shell: pwsh
        run: |
          az extension add --name microsoft-fabric --allow-preview true

      - name: Create capacity
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\infra\create-capacity.ps1 -UseConfig

      - name: Provision Fabric workspace, Lakehouse, data, notebook, and pipeline
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\provision-fabric.ps1
